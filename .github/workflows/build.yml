name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Gradle
      run: |
        echo "Téléchargement de Gradle 8.5..."
        curl -L --retry 3 --retry-delay 5 -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
        ls -la gradle.zip
        unzip -q gradle.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
    - name: Build APK
      run: gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
